[project]
name = "badminton-analysis"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "ultralytics==8.4.207",
    "opencv-python>=4.12,<5",
]

[project.optional-dependencies]
monotrack = ["scipy>=1.16,<2", "pandas>=3.1.1,<4", "tqdm>=4.67,<5"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
monotrack = "badminton_analysis.monotrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"badminton_analysis.monotrack" = ["LICENSE-*", "court_detector/*"]

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
